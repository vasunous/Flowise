version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: e2b
      POSTGRES_USER: e2b
      POSTGRES_PASSWORD: e2b_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2b -d e2b"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - e2b-network

  # ClickHouse Database
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: e2b
      CLICKHOUSE_USER: e2b
      CLICKHOUSE_PASSWORD: e2b_password
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - e2b-network

  # E2B Envd Service
  envd:
    image: envd-debug
    ports:
      - "8000:8000"
      - "8001:8001"
      - "9999:9999"
      - "2345:2345"
      - "49983:49983"
    command: ["/usr/bin/envd", "-isnotfc"]
    environment:
      - E2B_ENV=local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - e2b-network
    privileged: true  # Required for envd to work properly

  # Real E2B Orchestrator Service
  orchestrator:
    image: orchestrator-real:latest
    ports:
      - "3001:3001"
      - "5008:5008"
    environment:
      - NODE_ID=local-orchestrator-1
      - TEMPLATE_BUCKET_NAME=local-templates
      - ENVD_TIMEOUT=300s
      - ORCHESTRATOR_SERVICES=all
      - GCP_DOCKER_REPOSITORY_NAME=local
      - GOOGLE_SERVICE_ACCOUNT_BASE64=
      - OTEL_COLLECTOR_GRPC_ENDPOINT=
      - MAX_PARALLEL_MEMFILE_SNAPSHOTTING=1
    command: ["./orchestrator", "--port", "3001"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      envd:
        condition: service_started
    networks:
      - e2b-network
    privileged: true  # Required for orchestrator to manage containers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Allow orchestrator to manage Docker containers

  # E2B API Server (using existing binary)
  e2b-api:
    image: alpine:3.22
    ports:
      - "3000:3000"
    environment:
      - POSTGRES_CONNECTION_STRING=postgresql://e2b:e2b_password@postgres:5432/e2b?sslmode=disable
      - CLICKHOUSE_CONNECTION_STRING=http://clickhouse:8123
      - ENVIRONMENT=local
      - NODE_ID=local-api-1
      - ORCHESTRATOR_PORT=5008
      - LOCAL_CLUSTER_ENDPOINT=orchestrator:3001
      - LOCAL_CLUSTER_TOKEN=local-token-123
      - SANDBOX_ACCESS_TOKEN_HASH_SEED=local-seed-key-123
    volumes:
      - ../e2bdev/infra/packages/api/bin/api:/app/api:ro
    command: ["/app/api", "--port", "3000"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      orchestrator:
        condition: service_started
    networks:
      - e2b-network

  # Redis (for caching)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - e2b-network

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:

networks:
  e2b-network:
    driver: bridge
