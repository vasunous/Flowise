version: '3.8'

services:
  e2b-local:
    image: e2bdev/e2b:latest
    container_name: e2b-local
    ports:
      - "49982:49982"
    environment:
      - E2B_API_KEY=local-dummy-key
      - E2B_DEBUG=true
      - E2B_DOMAIN=localhost:49982
    volumes:
      - e2b_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:49982/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  e2b_data:
    driver: local