version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: e2b
      POSTGRES_USER: e2b
      POSTGRES_PASSWORD: e2b_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2b -d e2b"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - e2b-network

  # ClickHouse Database
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: e2b
      CLICKHOUSE_USER: e2b
      CLICKHOUSE_PASSWORD: e2b_password
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - e2b-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - e2b-network

  # E2B API Server (enhanced mock with real database connections)
  e2b-api:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://e2b:e2b_password@postgres:5432/e2b
      - CLICKHOUSE_URL=http://clickhouse:8123
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./e2b-api:/app
    command: >
      sh -c "
        npm install express cors dotenv axios pg redis ioredis &&
        node server.js
      "
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - e2b-network

  # Database Migration Service
  db-migrator:
    image: alpine:3.22
    environment:
      - POSTGRES_CONNECTION_STRING=postgresql://e2b:e2b_password@postgres:5432/e2b?sslmode=disable
    volumes:
      - ../e2bdev/infra/packages/db/migrations:/migrations:ro
    command: >
      sh -c "
        apk add --no-cache postgresql-client &&
        echo 'Waiting for database...' &&
        until pg_isready -h postgres -p 5432 -U e2b; do sleep 1; done &&
        echo 'Running migrations...' &&
        for migration in /migrations/*.sql; do
          echo 'Running migration: $$migration' &&
          psql -h postgres -U e2b -d e2b -f $$migration
        done &&
        echo 'Migrations completed'
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - e2b-network

  # ClickHouse Migration Service
  clickhouse-migrator:
    image: alpine:3.22
    environment:
      - CLICKHOUSE_CONNECTION_STRING=http://clickhouse:8123
    volumes:
      - ../e2bdev/infra/packages/clickhouse/migrations:/migrations:ro
    command: >
      sh -c "
        apk add --no-cache curl &&
        echo 'Waiting for ClickHouse...' &&
        until curl -f http://clickhouse:8123/ping; do sleep 1; done &&
        echo 'Running ClickHouse migrations...' &&
        for migration in /migrations/*.sql; do
          echo 'Running migration: $$migration' &&
          curl -X POST 'http://clickhouse:8123/' --data-binary @$$migration
        done &&
        echo 'ClickHouse migrations completed'
      "
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - e2b-network

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:

networks:
  e2b-network:
    driver: bridge
